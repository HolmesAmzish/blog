[versions]
kotlin = "2.2.21"
spring-boot = "4.0.3"
spring-dependency-management = "1.1.7"
spring-ai = "2.0.0-M5"
querydsl = "5.1.0"
thumbnailator = "0.4.20"

arorms-framework = "1.0-SNAPSHOT"

[libraries]
# --- Spring Boot Starters ---
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-graphql = { module = "org.springframework.boot:spring-boot-starter-graphql" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }

# --- Spring AI ---
spring-ai-starter-model-openai = { module = "org.springframework.ai:spring-ai-starter-model-openai" }

# --- Kotlin ---
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }

querydsl-jpa = { module = "com.querydsl:querydsl-jpa", version.ref = "querydsl" }
querydsl-apt = { module = "com.querydsl:querydsl-apt", version.ref = "querydsl" }
postgresql = { module = "org.postgresql:postgresql" }

thumbnailator = { module = "net.coobird:thumbnailator", version.ref = "thumbnailator" }

arorms-common = { module = "cn.arorms.framework:arorms-common", version.ref = "arorms-framework" }
arorms-security = { module = "cn.arorms.framework:arorms-security", version.ref = "arorms-framework" }

spring-graphql-test = { module = "org.springframework.graphql:spring-graphql-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
spring-web = ["spring-boot-starter-webmvc", "spring-boot-starter-webflux"]
spring-security = ["spring-boot-starter-security", "spring-boot-starter-oauth2-resource-server"]
jackson = ["jackson-databind", "jackson-module-kotlin"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }