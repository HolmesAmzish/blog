spring:
  application:
    name: backend
  server:
    port: ${PORT:8080}

  # Database Configuration (credentials from environment variables)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:blog_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # JWT Configuration (issuer pinned per profile)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:https://auth.arorms.cn/realms/arorms}

  servlet:
    multipart:
      enabled: true
      max-file-size: 16MB
      max-request-size: 20MB

  # OpenAI Config, used for AI translation
  ai:
    openai:
      api-key: ${OPENAI_APIKEY}
      base-url: ${OPENAI_BASEURL}
      chat:
        options:
          model: ${OPENAI_MODEL}

storage:
  location: ${UPLOAD_PATH:upload}

application:
  # JWT Configuration
  security:
    jwt:
      audience: ${JWT_AUD:blog-backend}

  # Cloudflare Configuration, used for view statistics query
  cloudflare:
    zone-id: ${CLOUDFLARE_ZONE_ID}
    token: ${CLOUDFLARE_TOKEN}
