spring.application.name=backend
server.port=${PORT:8080}

storage.location=${UPLOAD_PATH:upload}

# Database Configuration (credentials from environment variables)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:blog_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# Cloudflare Configuration, used for view statistics query
application.cloudflare.zone-id=${CLOUDFLARE_ZONE_ID}
application.cloudflare.token=${CLOUDFLARE_TOKEN}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=20MB

# OpenAI Config, used for AI translation
spring.ai.openai.api-key=${OPENAI_APIKEY}
spring.ai.openai.base-url=${OPENAI_BASEURL:https://api.minimaxi.com/v1}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:MiniMax-M2.7}
